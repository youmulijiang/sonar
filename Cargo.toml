[package]
name = "sonar"
version = "0.1.0"
edition = "2024"
description = "IP 探活扫描器：ICMP / 系统 ping / TCP Ping / 端口扫描多方式快速探活"
license = "MIT"
repository = "https://github.com/youmulijiang/sonar"
authors = ["sonar"]

[dependencies]
# UI（gpui-kit 统一入口，含 gpui + 组件库 + 图标资源）
gpui-kit = "0.8.1"

# 异步运行时与工具
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"

# 网络与解析
ipnet = "2"
socket2 = "0.5"

# 事件通道 / CLI / 错误 / 文件对话框
crossbeam-channel = "0.5"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
] }

[profile.release]
opt-level = 3
lto = "thin"
